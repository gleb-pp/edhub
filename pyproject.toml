[project]
name = "edhub"
version = "0.1.0"
description = "FastAPI Backend Service for a Learning Management System implementing layered architecture and role-based access control."
authors = [
    { name = "Gleb Popov", email = "popov.gleb.1225.2005@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "psycopg[binary]>=3.3,<4.0",
    "fastapi>=0.128,<1.0",
    "uvicorn>=0.40,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "pydantic-settings>=2.12,<3.0",
    "python-jose[cryptography]>=3.5,<4.0",
    "bcrypt>=4.0,<5.0",
    "regex>=2026.1.15,<2027.0",
    "python-multipart>=0.0.22,<1.0",
]

[tool.poetry]
packages = [
    { include = "backend" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "A", "C4", "DTZ", "T20"]
ignore = [
    "D100",
    "D104",
    "D105",
    "D107",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.mypy]
mypy_path = "backend"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
exclude = "venv/"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.4,<1.0",
    "types-python-jose>=3.5,<4.0",
    "types-regex>=2026.1.15,<2027.0",
]
