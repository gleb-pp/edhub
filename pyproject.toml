[project]
name = "edhub"
version = "0.1.0"
description = "FastAPI Backend Service for a Learning Management System implementing layered architecture and role-based access control."
authors = [
    { name = "Gleb Popov", email = "popov.gleb.1225.2005@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "psycopg[binary]>=3.3,<4.0",
    "fastapi>=0.128,<1.0",
    "uvicorn>=0.40,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "pydantic-settings>=2.12,<3.0",
    "python-jose[cryptography]>=3.5,<4.0",
    "bcrypt>=4.0,<5.0",
    "regex>=2026.1.15,<2027.0",
    "python-multipart>=0.0.22,<1.0",
]

[tool.poetry]
packages = [
    { include = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",    # Docstrings in public modules
    "D104",    # Docstrings in public package
    "D107",    # Docstrings in __init__
    "D212",    # multi-line-summary-first-line
    "D203",    # blank line required before class docstring
    "D211",    # no-blank-line-before-class
    "E501",    # Line too long
    "T201",    # Print found
    "B008",    # Do not perform function call `Query` in argument defaults
    "G004",    # Logging statement uses f-string
    "TRY301",  # Abstract `raise` to an inner function
    "TRY300",  # Moving 'return' to an `else` block
    "ERA001",  # Commented code (fix later)
    "D101",    # docstrings - continue with copilot (fix later)
    "PLR0913", # Too many arguments (fix later)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
exclude = "venv/"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.4,<1.0",
    "types-python-jose>=3.5,<4.0",
    "types-regex>=2026.1.15,<2027.0",
]
