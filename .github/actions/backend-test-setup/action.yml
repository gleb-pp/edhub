name: Backend test setup
description: Setup DB, build backend, run test container

runs:
  using: "composite"
  steps:
    - uses: docker/setup-buildx-action@v3

    - run: docker network create edhub-network
      shell: bash

    - run: |
        docker run -d \
          --name system_db \
          --network edhub-network \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=12345678 \
          -e POSTGRES_DB=edhub \
          postgres:16
      shell: bash

    - run: |
        for i in {1..30}; do
          if docker exec system_db pg_isready -U postgres; then exit 0; fi
          sleep 2
        done
        exit 1
      shell: bash

    - run: docker build --target test -t edhub-backend-test .
      shell: bash

    - run: |
        docker run -d \
          --name backend \
          --network edhub-network \
          --entrypoint sh \
          -e DATABASE_URL=postgresql://postgres:12345678@system_db:5432/edhub \
          -e JWT_SECRET_KEY=test-secret \
          edhub-backend-test \
          -c "sleep infinity"
      shell: bash
