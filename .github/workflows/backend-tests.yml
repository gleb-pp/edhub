      - name: Run backend container (test mode)
        run: |
          docker run -d \
            --name backend \
            --network edhub-network \
            --entrypoint sh \
            -e DATABASE_URL=postgresql://postgres:12345678@system_db:5432/edhub \
            -e JWT_SECRET_KEY=test-secret \
            edhub-backend \
            -c "sleep infinity"

      - name: Admin policy tests
        run: docker exec backend pytest ./tests/policies/test_admin.py
      
      - name: Courses policy tests
        run: docker exec backend pytest ./tests/policies/test_courses.py
      
      - name: Grades policy tests
        run: docker exec backend pytest ./tests/policies/test_grades.py

      - name: Parents policy tests
        run: docker exec backend pytest ./tests/policies/test_parents.py
      
      - name: Students policy tests
        run: docker exec backend pytest ./tests/policies/test_students.py
      
      - name: Teachers policy tests
        run: docker exec backend pytest ./tests/policies/test_teachers.py

      - name: Stop containers
        if: always()
        run: |
          docker stop backend system_db || true
          docker rm backend system_db || true
          docker network rm edhub-network || true
