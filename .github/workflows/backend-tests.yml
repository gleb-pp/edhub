name: Backend tests

on:
  push:

jobs:
  backend-db-test:
    runs-on: ubuntu-latest
    name: Backend + DB Integration Test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Docker network
        run: docker network create edhub-network

      - name: Build backend
        run: docker build -t edhub-backend ./backend

      - name: Run system_db container
        run: |
          docker run -d \
            --name system_db \
            --network edhub-network \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=12345678 \
            -e POSTGRES_DB=edhub \
            postgres:16

      - name: Wait for system_db to be ready
        run: |
          echo "Waiting for system_db to be ready..."
          for i in {1..30}; do
            if docker exec system_db pg_isready -U postgres; then
              echo "system_db is ready!"
              exit 0
            fi
            echo "Waiting for system_db... ($i/30)"
            sleep 2
          done
          echo "system_db failed to start" && docker logs system_db
          exit 1

      - name: Run backend container
        run: |
          docker run -d \
            --name backend \
            --network edhub-network \
            -p 8000:8000 \
            -e DATABASE_URL=postgresql://postgres:12345678@system_db:5432/edhub \
            -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            edhub-backend

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/openapi.json >/dev/null; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          (echo "Backend failed to start" && docker logs backend && docker logs system_db && exit 1)
          exit 1

      - name: Stop containers
        if: always()
        run: |
          docker stop backend system_db || true
          docker rm backend system_db || true
          docker network rm edhub-network || true

  courses-tests:
    runs-on: ubuntu-latest
    name: Test Courses with PyTest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Docker network
        run: docker network create edhub-network

      - name: Run system_db container
        run: |
          docker run -d \
            --name system_db \
            --network edhub-network \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=12345678 \
            -e POSTGRES_DB=edhub \
            postgres:16

      - name: Wait for system_db to be ready
        run: |
          echo "Waiting for system_db to be ready..."
          for i in {1..30}; do
            if docker exec system_db pg_isready -U postgres; then
              echo "system_db is ready!"
              exit 0
            fi
            echo "Waiting for system_db... ($i/30)"
            sleep 2
          done
          echo "system_db failed to start"
          docker logs system_db
          exit 1

      - name: Build backend image
        run: docker build -t edhub-backend ./backend

      - name: Run backend container (test mode)
        run: |
          docker run -d \
            --name backend \
            --network edhub-network \
            --entrypoint sh \
            -e DATABASE_URL=postgresql://postgres:12345678@system_db:5432/edhub \
            -e JWT_SECRET_KEY=test-secret \
            edhub-backend \
            -c "sleep infinity"
      
      - name: Courses service tests
        run: docker exec backend pytest /app/backend/services/test_courses.py

      - name: Courses router tests
        run: docker exec backend pytest /app/backend/routers/test_courses.py

      - name: Courses policy tests
        run: docker exec backend pytest /app/backend/policies/test_courses.py

      - name: Stop containers
        if: always()
        run: |
          docker stop backend system_db || true
          docker rm backend system_db || true
          docker network rm edhub-network || true
