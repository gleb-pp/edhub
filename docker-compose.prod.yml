services:
  system_db:
    build: ./database/system
    restart: always
    environment:
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_USER=postgres
    volumes:
      - edhub_system_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  filestorage_db:
    build: ./database/filestorage
    restart: always
    environment:
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_USER=postgres
    volumes:
      - edhub_filestorage_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edhub_storage"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:12345678@system_db:5432/edhub
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      system_db:
        condition: service_healthy
      filestorage_db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      - backend

  nginx:
    build: ./nginx-prod
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - /etc/letsencrypt/live/edhub.space/fullchain.pem:/etc/letsencrypt/live/edhub.space/fullchain.pem:ro
      - /etc/letsencrypt/live/edhub.space/privkey.pem:/etc/letsencrypt/live/edhub.space/privkey.pem:ro
    depends_on:
      - frontend
      - backend

volumes:
  edhub_system_storage:
  edhub_filestorage_storage:
