services:
  system_db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_USER=postgres
      - POSTGRES_DB=edhub
    volumes:
      - edhub_system_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:12345678@system_db:5432/edhub
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      system_db:
        condition: service_healthy

volumes:
  edhub_system_storage:
